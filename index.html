<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f4f4f5" />
    <!-- Inline script: the theme boot snippet below. wasm: sql.js in the browser build. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://www.strava.com https://*.strava.com https://*.vercel.app; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <script>
      // Paint in the saved theme before the app (and its settings) load. See src/lib/theme.ts.
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('theme') || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.background = dark ? '#09090b' : '#f4f4f5'
      })()
    </script>
    <title>Adam's Workout App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
