<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f4f4f5" />
    <script>
      // Paint in the saved theme before the app (and its settings) load. See src/lib/theme.ts.
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('theme') || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.background = dark ? '#09090b' : '#f4f4f5'
      })()
    </script>
    <title>Simple Workout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
