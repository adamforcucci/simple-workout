version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      capacitor: { patterns: ['@capacitor/*', '@capacitor-community/*'] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
